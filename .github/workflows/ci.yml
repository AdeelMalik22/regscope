name: CI

permissions:
  contents: read
  actions: read

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Validate wheel installation
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Validate clean package import
        run: python -c "import regscope; from regscope import track; print(regscope.__version__)"

  publish-baseline:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install ".[dev]"
      - name: Generate trusted baseline
        run: |
          rm -rf .regscope
          REGSCOPE_CI_BASELINE=1 REGSCOPE_TRUSTED_BASELINE=1 python -m pytest tests/ci_targets \
            --regscope-baseline-dir .regscope \
            --regscope-update-baseline
      - name: Upload trusted baseline
        if: hashFiles('.regscope/**/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: regscope-baseline-master
          path: .regscope/
          retention-days: 30

  download-baseline:
    needs: tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest trusted master baseline
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: ci.yml
          workflow_conclusion: success
          branch: master
          name: regscope-baseline-master
          path: .regscope
      - name: Report baseline availability
        run: |
          if find .regscope -name '*.json' -print -quit | grep -q .; then
            echo "Trusted RegScope baseline downloaded."
          else
            echo "No trusted baseline artifact is available yet."
          fi
      - name: Compare current behavior with trusted baseline
        run: REGSCOPE_CI_BASELINE=1 python -m pytest tests/ci_targets --regscope-baseline-dir .regscope
